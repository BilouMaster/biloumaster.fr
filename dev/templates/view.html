<nav id="arrows">{go_prev}{go_next}</nav>
<figure aria-labelledby="main_title main_desc" class="img_container" style="--height: {height}px;">
    <img
        class="viewable"
        src="/img/gallery/{filename}.webp"
        srcset="{srcset}"
        sizes="{sizes}"
        loading="eager"
        decoding="async"
        fetchpriority="high"
        alt="{alt}"
    >
    <figcaption class="image-context">
        {alt}
    </figcaption>
</figure>
{tags}
